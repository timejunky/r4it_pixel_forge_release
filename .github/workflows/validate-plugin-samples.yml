name: Validate plugin samples

on:
  pull_request:
    branches: [plugins]
  push:
    branches: [plugins]
  workflow_dispatch:

jobs:
  validate:
    name: validate-plugin-samples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate plugin.json sidecars
        run: python .github/scripts/validate_plugin_samples.py
